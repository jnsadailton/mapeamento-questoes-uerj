# Catálogo dos PDFs oficiais usados no projeto.
#
# Um registro por exame e tipo de documento (21 exames x 4 tipos). A ingestão (python -m uerj.ingestao) tenta as fontes
# nesta ordem e usa a primeira que devolver o arquivo com o sha256 abaixo:
#   1. url_oficial  - site da UERJ (vestibular.uerj.br ou revista.vestibular.uerj.br)
#   2. url_wayback  - captura do Wayback Machine com o mesmo conteúdo (null quando não há)
#   3. arquivo      - cópia versionada neste repositório
#
# coletado_em: data em que o sha256 foi conferido na fonte oficial ou no Wayback.
# Os conteúdos programáticos de 2016 a 2018 estavam em sistema.vestibular.uerj.br, que saiu do ar, e o de 2024-1 foi
# removido do site: nesses, url_oficial é o endereço original e o arquivo vem do Wayback.
# Nos anos com dois exames, o conteúdo programático é o mesmo arquivo nos dois.

