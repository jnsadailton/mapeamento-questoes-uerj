[project]
name = "mapeamento-questoes-uerj"
version = "0.1.0"
description = "Mapa do que caiu nas provas objetivas do Vestibular Estadual da UERJ desde 2016"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=25.0.1",
    "pymupdf>=1.26",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uerj"

[tool.pytest.ini_options]
testpaths = ["tests"]
