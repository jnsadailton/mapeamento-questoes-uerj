appearance:
  default: system
  switcher: true

deployment:
  # GitHub Pages serve o site em https://<usuário>.github.io/mapeamento-questoes-uerj/
  basePath: /mapeamento-questoes-uerj

# Cores documentadas e validadas em docs/paleta-de-cores.md. Mude lá e aqui juntos.
theme:
  colorPalettes:
    default:
      light: ["#0072CE", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]
      dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
  colorScales:
    default:
      light: ["#d6e8f8", "#00427a"]
      dark: ["#0d2a47", "#9cc8f0"]
  colors:
    primary:
      light: "#0072CE"
      dark: "#4da3ff"
    primary-content:
      light: "#ffffff"
      dark: "#0d1b2a"
    accent:
      light: "#AD841F"
      dark: "#d4a93a"
    # papel e tinta do caderno de prova (#231F20 é a cor do texto nos PDFs); no escuro, marinho derivado do azul UERJ
    base:
      light: "#fbfbf9"
      dark: "#0d1b2a"
    base-heading:
      light: "#231f20"
      dark: "#f4f6f9"
    base-content:
      light: "#3a3638"
      dark: "#dce3ec"
    base-content-muted:
      light: "#6b6567"
      dark: "#9fb0c3"
    info:
      light: "#0072CE"
      dark: "#4da3ff"
    positive:
      light: "#0ca30c"
      dark: "#0ca30c"
    warning:
      light: "#fab219"
      dark: "#fab219"
    negative:
      light: "#d03b3b"
      dark: "#e66767"
    # Uma cor fixa por área (gráficos usam seriesColors com estes nomes)
    area-lin:
      light: "#0072CE"
      dark: "#3987e5"
    area-mat:
      light: "#eb6834"
      dark: "#d95926"
    area-cnt:
      light: "#1baf7a"
      dark: "#199e70"
    area-chs:
      light: "#eda100"
      dark: "#c98500"

    # Eixos dentro de uma área (gráfico de dispersão da Dificuldade): sempre junto com o formato do ponto
    # (círculo, quadrado, triângulo, losango), ver docs/paleta-de-cores.md
    eixo-1:
      light: "#0072CE"
      dark: "#3987e5"
    eixo-2:
      light: "#E0A800"
      dark: "#d4a017"
    eixo-3:
      light: "#C2410C"
      dark: "#c9531f"
    eixo-4:
      light: "#3FA9F5"
      dark: "#6cc0f7"

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}
