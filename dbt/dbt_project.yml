name: uerj
version: "1.0.0"
config-version: 2
profile: uerj

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Exames sem percentual de acertos publicado no gabarito comentado.
  exames_sem_percentual: ["2021-1", "2024-2", "2027-2"]
  # Questões anuladas no gabarito oficial (exame: número).
  anuladas:
    "2017-2": 35
    "2023-1": 34
    "2024-1": 29
    "2024-2": 59
    "2025-2": 38
    "2026-1": 38
    "2027-1": 29
    "2027-2": 34

models:
  uerj:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  uerj:
    conteudo_base:
      +column_types:
        item_vigente: boolean
        subitem_vigente: boolean
    correcoes:
      +column_types:
        exame: varchar
        idioma: varchar
        questao: integer
        ordem: integer
        percentual_acertos: double
        nivel: varchar
        observacao: varchar
    eixos_atribuidos:
      +column_types:
        exame: varchar
        idioma: varchar
        questao: integer
