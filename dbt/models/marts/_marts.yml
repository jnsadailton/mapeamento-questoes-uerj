version: 2

models:
  - name: dim_exame
    description: Um exame por linha (21 exames de 2016 a 2027). O ano é o do vestibular, não o da aplicação.
    columns:
      - name: id_exame
        description: "Identificador AAAA-N: ano do vestibular e número do exame (o Exame Único usa -1)."
        data_tests: [unique, not_null]
      - name: tipo
        description: Qualificação (2016–2020 e 2024–2027) ou Único (2021–2023).
        data_tests:
          - accepted_values:
              arguments:
                values: ["Qualificação", "Único"]
      - name: data_aplicacao
        description: Data da prova, lida do gabarito oficial.
        data_tests: [not_null]
      - name: url_prova
        description: Link para o PDF oficial da prova no site da UERJ.
        data_tests: [not_null]
      - name: documentos_fora_do_site_oficial
        description: Quantos dos 4 PDFs do exame não vieram do site da UERJ na última ingestão (Wayback ou cópia).

  - name: dim_conteudo
    description: >
      Hierarquia canônica de conteúdo (Área › Eixo › Item › Subitem), com uma linha por item e uma por subitem.
      Construída na curadoria a partir do edital de 2027; itens e subitens de editais anteriores sem equivalente
      atual ficam com `vigente = false`. Os textos de cada edital e de cada comentário apontam para cá pelo
      dicionário (seeds/dicionario_conteudo.csv).
    columns:
      - name: id_conteudo
        description: ID do item (AREA.E.II) ou do subitem (AREA.E.II.SS).
        data_tests: [unique, not_null]
      - name: nivel
        data_tests:
          - accepted_values:
              arguments:
                values: ["item", "subitem"]
      - name: id_area
        description: LIN, MAT, CNT (Ciências da Natureza) ou CHS (Ciências Humanas).
        data_tests:
          - accepted_values:
              arguments:
                values: ["LIN", "MAT", "CNT", "CHS"]
      - name: disciplina
        description: >
          Física, Química ou Biologia em Ciências da Natureza; Língua Portuguesa (Construção do texto) ou Literatura
          (Aspectos literários) em Linguagens; Matemática; Ciências Humanas fica como área única, porque os editais
          não separam Geografia de História. Língua Estrangeira é atribuída por questão, em fct_classificacao.
        data_tests: [not_null]

  - name: fct_questao
    description: Uma linha por questão e idioma. No bloco de língua estrangeira, cada idioma é uma questão.
    columns:
      - name: id_questao
        description: "AAAA-N-NN, com sufixo -ES, -FR ou -EN no bloco de língua estrangeira."
        data_tests: [unique, not_null]
      - name: id_exame
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_exame')
                field: id_exame
      - name: resposta
        description: Resposta do gabarito oficial (A a D) ou ANULADA.
        data_tests:
          - accepted_values:
              arguments:
                values: ["A", "B", "C", "D", "ANULADA"]
      - name: percentual_acertos
        description: >
          Percentual de acertos publicado no gabarito comentado. Ausente quando o próprio PDF não traz o dado: 2021
          (o comentado não tem o campo), 2024-2 (campo em branco), 2027-2, as anuladas e algumas questões isoladas
          (2020-2 e 2022-1). É uma limitação da fonte, não da extração.
      - name: nivel
        description: Nível de dificuldade do gabarito comentado (facil, medio, dificil).
        data_tests:
          - accepted_values:
              arguments:
                values: ["facil", "medio", "dificil"]
      - name: nivel_estimado
        description: Verdadeiro quando a questão não tem comentário oficial e o nível foi estimado pelo projeto.
      - name: observacoes
        description: Adendos públicos (exibidos no site) sobre o que o projeto completou ou deduziu na classificação.
      - name: pagina_prova
        description: Página do caderno de prova em que a questão começa (o site abre o PDF nela).
        data_tests: [not_null]

  - name: fct_classificacao
    description: >
      Questão × conteúdo (N:N): uma linha por subitem (ou só item) ligado a cada versão de questão. Inclui as
      classificações dos gabaritos comentados e as de seeds/correcoes, com os adendos públicos.
    data_tests:
      - combinacao_unica:
          arguments:
            columns: [id_questao, id_conteudo]
    columns:
      - name: id_questao
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_questao')
                field: id_questao
      - name: id_conteudo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_conteudo')
                field: id_conteudo
      - name: disciplina
        data_tests: [not_null]
      - name: observacao
        description: Adendo público quando o projeto completou, deduziu ou estimou a classificação.

  - name: bridge_programa_ano
    description: Em que exames cada subitem canônico consta do edital.
    columns:
      - name: id_subitem
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_conteudo')
                field: id_conteudo

  - name: mart_incidencia
    description: >
      Quantas questões de cada exame tocaram cada conteúdo, nos níveis área, eixo, item e subitem. A unidade é o
      número da questão: as três versões de língua estrangeira contam uma vez.
  - name: mart_dificuldade
    description: Percentual de acertos médio, mediano, mínimo e máximo por item e subitem.
  - name: mart_lacunas
    description: >
      Subitens do edital vigente com quantas vezes e quando caíram; `nunca_caiu` marca as lacunas. As redações antigas
      já estão ligadas ao subitem atual equivalente. `qtd_exames_no_edital` e `primeiro_ano_no_edital` mostram há quanto
      tempo o subitem está no programa.
  - name: pendencias
    description: Textos de edital ou comentário sem ligação no dicionário. Precisa estar vazio.

  - name: dim_documento
    description: >
      Os PDFs de cada exame (prova, gabarito, conteúdo programático e gabarito comentado) com a URL oficial, a captura
      do Wayback Machine e a fonte usada na última ingestão (uerj, wayback ou repositorio).
    data_tests:
      - combinacao_unica:
          arguments:
            columns: [id_exame, tipo]
    columns:
      - name: id_exame
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_exame')
                field: id_exame
      - name: tipo
        data_tests:
          - accepted_values:
              arguments:
                values: ["prova", "gabarito", "conteudo_programatico", "gabarito_comentado"]
      - name: fonte_ultima_ingestao
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["uerj", "wayback", "repositorio"]

  - name: mart_recorrencia
    description: >
      Recorrência de cada item e subitem nos 21 exames. Os intervalos são medidos em exames (2016-1 = 1, 2027-2 = 21);
      as taxas usam como denominador os exames em que o conteúdo estava no edital. `regularidade` é a fração desses
      exames em que o conteúdo caiu; `indice_atraso` divide os exames desde a última cobrança pelo intervalo médio
      (só com 3 cobranças ou mais); `tendencia` compara a taxa dos 6 últimos exames com a dos anteriores;
      `sumido_que_volta` marca conteúdos do edital vigente que caíram 3 vezes ou mais e estão sem cair há pelo menos
      1,5 vez o intervalo médio (e no mínimo 2 exames). É um indicador descritivo, não uma previsão.
    data_tests:
      - combinacao_unica:
          arguments:
            columns: [nivel, id_conteudo]
    columns:
      - name: id_conteudo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_conteudo')
                field: id_conteudo
      - name: regularidade
        data_tests:
          - not_null
      - name: tendencia
        data_tests:
          - accepted_values:
              arguments:
                values: ["em alta", "em baixa", "estável", "sem histórico"]
